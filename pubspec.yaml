name: arabist_v2_app
description: "Open-source rewrite of Arabist — Arabic/Kazakh/Russian dictionary & learning app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5

  # Local storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # UI
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  freezed_annotation: ^2.4.1
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/arabist.db
